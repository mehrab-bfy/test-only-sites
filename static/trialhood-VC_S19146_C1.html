<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Static product page — Test Store</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <!--
    Plain HTML product page with Trialhood's embed snippet pasted as-is: no router, no integration framework.
    Use it to check the snippet exactly as a merchant would paste it.
  -->
  <header class="site-header"><div class="container header-inner"><a href="../index.html" class="logo">◆ Test Store</a><span class="muted">Static page (no SPA)</span></div></header>
  <main class="container">
    <div class="pdp">
      <div class="pdp-media">
        <div class="product-art large">
          <svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Rectangle Eyeglasses"><rect width="400" height="300" fill="#f4f1ec"/><g fill="#2f5d3a" fill-opacity=".75" stroke="#c9a227" stroke-width="6"><ellipse cx="135" cy="150" rx="62" ry="48"/><ellipse cx="265" cy="150" rx="62" ry="48"/></g><path d="M197 140 q3 -14 6 0" stroke="#c9a227" stroke-width="6" fill="none"/><path d="M73 135 L30 120 M327 135 L370 120" stroke="#c9a227" stroke-width="6"/></svg>
        </div>

        <!-- ===== Trialhood snippet, verbatim ===== -->
        <!-- Trialhood: 3D viewer and try-on. Reserve space so the page does not shift. -->
        <div id="trialhood-product" style="min-height: 420px"></div>
        <script defer src="https://cdn.trialhood.com/sdk/v1/loader.js" crossorigin="anonymous"></script>
        <script>
          (function () {
            function mount() {
              window.Trialhood.mount({
              target: '#trialhood-product',
              storeId: "st_98e038ef8da584a264adc0be",
              productId: "bcl",
              variantId: "variant_21238b03-fc67-4c8c-8234-077274d6e20a",
              // Set to true only after the shopper has agreed to analytics on your site.
              consent: { analytics: false },
              });
            }
            if (window.Trialhood) mount();
            else window.addEventListener('trialhood:ready', mount, { once: true });
          })();
        </script>
        <!-- ===== end Trialhood snippet ===== -->

      </div>
      <div class="pdp-info">
        <div class="muted">Test Optics</div>
        <h1>Rectangle Eyeglasses</h1>
        <div class="price large">$89.00</div>
        <div class="ids small mono">product: VC_S19146_C1 XW<br>variant: VC_S19146_C1 XW</div>
        <p><a href="../index.html#/product/VC_S19146_C1%20XW">Same product in the SPA store</a></p>
      </div>
    </div>
  </main>
</body>
</html>
