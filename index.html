<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Test Store — Universal Integration Tester</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="#/" class="logo">◆ Test Store</a>
      <nav class="main-nav">
        <a href="#/">Home</a>
        <a href="#/category/eyewear">Eyewear</a>
        <a href="#/category/apparel">Apparel</a>
        <a href="#/category/accessories">Accessories</a>
      </nav>
      <a href="#/cart" class="cart-link">Cart <span id="cart-count" class="badge">0</span></a>
    </div>
  </header>

  <!-- Integrations can render into named slots. See README "Slots". -->
  <div data-slot="global-top"></div>

  <main id="app" class="container" aria-live="polite"></main>

  <footer class="site-footer">
    <div class="container">
      <p>Test-only storefront. Not a real shop — nothing is sold or shipped.</p>
      <p><a href="static/index.html">Snippet pages (no SPA)</a> · <a href="#" data-action="open-devpanel">Open tester panel</a> · <a href="#" data-action="open-consent">Cookie settings</a></p>
    </div>
  </footer>

  <div data-slot="global-bottom"></div>

  <!-- Core (order matters) -->
  <script src="js/core.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/views.js"></script>
  <script src="js/devpanel.js"></script>
  <script src="js/consent.js"></script>
  <!-- Integration list lives in integrations/manifest.js -->
  <script src="integrations/manifest.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
